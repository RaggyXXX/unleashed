name: build-and-release

on:
  push:
    branches: [ main ]
    paths:
      - 'UnleashedBypass.cmd'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish installer to rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view installer >/dev/null 2>&1; then
            gh release upload installer UnleashedBypass.cmd --clobber
          else
            gh release create installer UnleashedBypass.cmd \
              --title 'Unleashed Installer' \
              --notes 'Latest installer (self-updating).' \
              --latest
          fi
